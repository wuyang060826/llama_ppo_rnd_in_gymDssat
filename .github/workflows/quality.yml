name: Research and demo checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install CPU test dependencies
        run: |
          python -m pip install "numpy<2"
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Run Python regressions
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Run browser data regressions
        run: node --test tests/fieldlab.test.cjs
      - name: Verify generated bundle and entry points
        run: |
          python scripts/build_fieldlab.py --check
          python scripts/demo_results.py > /tmp/results.md
          python main/llama_ppo_rnd/llama_ppo_rnd_update_glm5_v3.py --help
          python -m compileall -q main scripts tests
          node --check docs/fieldlab/app.js
          git diff --exit-code
